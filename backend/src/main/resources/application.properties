spring.application.name=cardwise-backend
server.port=8080
cardwise.catalogue.mode=${CARDWISE_CATALOGUE_MODE:DEMO}

# PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/cardwise_db
spring.datasource.username=cardwise_user
spring.datasource.password=${DB_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true